<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 圆角矩形背景 -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#gradient-bg)"/>
  
  <!-- 甘特图图形 - 优化布局 -->
  <g transform="translate(40, 60)">
    <!-- 时间轴线条 -->
    <line x1="0" y1="20" x2="176" y2="20" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="60" x2="176" y2="60" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="100" x2="176" y2="100" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- 任务条 1 - 已完成 -->
    <rect x="8" y="8" width="56" height="24" rx="6" fill="white"/>
    
    <!-- 任务条 2 - 进行中 -->
    <rect x="80" y="48" width="72" height="24" rx="6" fill="rgba(255,255,255,0.85)"/>
    
    <!-- 任务条 3 - 待办（左侧接近任务1中线，右侧接近任务2中线） -->
    <rect x="32" y="88" width="84" height="24" rx="6" fill="rgba(255,255,255,0.5)"/>
    
    <!-- 依赖关系连接线 - 曲线（无箭头） -->
    <!-- 任务1 -> 任务2 的曲线依赖线 -->
    <path d="M64 20 Q72 20 72 36 Q72 60 80 60" stroke="rgba(255,255,255,0.8)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- 依赖节点圆点 - 居中位置 -->
    <circle cx="64" cy="20" r="4" fill="#3B82F6" stroke="white" stroke-width="1.5"/>
    <circle cx="80" cy="60" r="4" fill="#6366F1" stroke="white" stroke-width="1.5"/>
  </g>
  
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="gradient-bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
</svg>
